name: Mettre à jour les données Cerema

on:
  schedule:
    - cron: "17 4 * * 1" # chaque lundi à 04:17 UTC
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/fetch-data.mjs"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Récupérer les données Cerema
        run: node scripts/fetch-data.mjs

      - name: Committer les données si elles ont changé
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Mettre à jour les données Cerema (conso d'espace, friches)"
          git push
